<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1400" viewBox="0 0 1080 1400" role="img" aria-labelledby="title desc">
  <title id="title">Sample output from the interactive stack program</title>
  <desc id="desc">A terminal-style capture showing stack capacity 3, pushes of 10 and 20, displaying and popping 20, checking the stack state, and exiting.</desc>
  <rect width="1080" height="1400" rx="14" fill="#0b1020" />
  <path d="M0 14a14 14 0 0 1 14-14h1052a14 14 0 0 1 14 14v42H0z" fill="#1b2436" />
  <circle cx="27" cy="28" r="7" fill="#ff5f57" />
  <circle cx="51" cy="28" r="7" fill="#febc2e" />
  <circle cx="75" cy="28" r="7" fill="#28c840" />
