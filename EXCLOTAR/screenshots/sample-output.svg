    <text x="28" y="986" fill="#a6e3a1">Successfully popped 20 from the stack.</text>
    <text x="28" y="1015" fill="#89a0bb">--- Stack Operations Menu ---</text>
    <text x="28" y="1038">1. Push an element</text>
